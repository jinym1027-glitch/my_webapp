<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KBO 프로야구 경기 스케줄을 한눈에 관리하는 웹 애플리케이션">
    <title>KBO 스케줄러 - 프로야구 경기 일정 관리</title>
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 배경 동적 그라디언트 구체 -->
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>
    <div class="glow-sphere sphere-3"></div>

    <div class="app-layout">
        <!-- 상단 헤더 -->
        <header class="app-header">
            <div class="brand-area">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M6.5 6.5c2 1 3.5 3 3.5 5.5s-1.5 4.5-3.5 5.5M17.5 6.5c-2 1-3.5 3-3.5 5.5s1.5 4.5 3.5 5.5"/>
                    </svg>
                </div>
                <div>
                    <h1 class="brand-title">KBO 스케줄러</h1>
                    <p class="brand-subtitle">Flask 기반 프로야구 경기 일정 관리 시스템</p>
                </div>
            </div>

            <div class="header-status">
                <div class="server-badge" id="server-status-badge">
                    <span class="pulse-dot"></span>
                    <span id="server-status-text">Flask 서버 정상 구동 중</span>
                </div>
                <div class="today-date" id="current-date-display">2026. 09. 17</div>
            </div>
        </header>

        <!-- 핵심 통계 대시보드 -->
        <section class="dashboard-stats" aria-label="경기 통계 현황">
            <div class="stat-card total-card">
                <div class="stat-icon total-icon">⚾</div>
                <div class="stat-info">
                    <span class="stat-label">전체 경기</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>

            <div class="stat-card pending-card">
                <div class="stat-icon pending-icon">🗓️</div>
                <div class="stat-info">
                    <span class="stat-label">예정</span>
                    <span class="stat-value" id="stat-scheduled">0</span>
                </div>
            </div>

            <div class="stat-card live-card">
                <div class="stat-icon live-icon">🔴</div>
                <div class="stat-info">
                    <span class="stat-label">진행중</span>
                    <span class="stat-value" id="stat-live">0</span>
                </div>
            </div>

            <div class="stat-card completed-card">
                <div class="stat-icon completed-icon">🏁</div>
                <div class="stat-info">
                    <span class="stat-label">종료</span>
                    <span class="stat-value" id="stat-finished">0</span>
                </div>
            </div>

            <div class="stat-card today-card">
                <div class="stat-icon today-icon">📅</div>
                <div class="stat-info">
                    <span class="stat-label">오늘 경기</span>
                    <span class="stat-value" id="stat-today">0</span>
                </div>
            </div>
        </section>

        <!-- 메인 콘텐츠 영역 -->
        <main class="main-content-grid">
            <!-- 좌측: 신규 경기 등록 폼 -->
            <aside class="create-todo-panel glass-panel">
                <h2 class="panel-heading">새 경기 일정 등록</h2>
                <form id="create-game-form" class="todo-form">
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="game-home-select" class="form-label">홈팀 <span class="required">*</span></label>
                            <select id="game-home-select" class="select-control" required></select>
                        </div>
                        <div class="form-group half">
                            <label for="game-away-select" class="form-label">원정팀 <span class="required">*</span></label>
                            <select id="game-away-select" class="select-control" required></select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="game-date-input" class="form-label">경기 날짜 <span class="required">*</span></label>
                            <input type="date" id="game-date-input" class="input-control" required>
                        </div>
                        <div class="form-group half">
                            <label for="game-time-input" class="form-label">경기 시간</label>
                            <input type="time" id="game-time-input" class="input-control" value="18:30">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="game-stadium-input" class="form-label">구장</label>
                        <input type="text" id="game-stadium-input" class="input-control" placeholder="홈팀 선택 시 자동 입력됩니다">
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="game-status-select" class="form-label">경기 상태</label>
                            <select id="game-status-select" class="select-control">
                                <option value="예정" selected>🗓️ 예정</option>
                                <option value="진행중">🔴 진행중</option>
                                <option value="종료">🏁 종료</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label for="game-broadcast-input" class="form-label">중계 채널</label>
                            <input type="text" id="game-broadcast-input" class="input-control" placeholder="예: SPOTV">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="game-memo-input" class="form-label">메모</label>
                        <textarea id="game-memo-input" class="textarea-control" rows="2" placeholder="더비 매치, 특이사항 등"></textarea>
                    </div>

                    <button type="submit" id="btn-submit-game" class="btn btn-primary btn-block">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        경기 일정 추가하기
                    </button>
                </form>
            </aside>

            <!-- 우측: 경기 목록 및 필터/검색 바 -->
            <section class="todo-list-panel glass-panel">
                <!-- 필터 및 검색 바 -->
                <div class="list-toolbar">
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="search-input" class="search-control" placeholder="팀, 구장, 메모 검색...">
                        <button type="button" id="btn-clear-search" class="clear-search-btn" title="검색어 초기화" style="display: none;">✕</button>
                    </div>

                    <div class="filter-controls">
                        <!-- 상태 탭 -->
                        <div class="filter-tabs" role="tablist">
                            <button type="button" class="filter-tab active" data-status="all" id="filter-all-btn">전체</button>
                            <button type="button" class="filter-tab" data-status="예정" id="filter-scheduled-btn">예정</button>
                            <button type="button" class="filter-tab" data-status="진행중" id="filter-live-btn">진행중</button>
                            <button type="button" class="filter-tab" data-status="종료" id="filter-finished-btn">종료</button>
                        </div>

                        <!-- 팀 필터 드롭다운 -->
                        <select id="filter-team-select" class="filter-select">
                            <option value="all">전체 구단</option>
                        </select>
                    </div>
                </div>

                <!-- 경기 리스트 컨테이너 -->
                <div class="todo-list-container" id="todo-list-container">
                    <div class="loading-spinner-area" id="loading-indicator">
                        <div class="spinner"></div>
                        <p>경기 일정을 불러오는 중...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- 수정 모달 -->
        <div class="modal-overlay" id="edit-modal" style="display: none;">
            <div class="modal-card glass-panel">
                <div class="modal-header">
                    <h3 class="modal-title">경기 일정 수정</h3>
                    <button type="button" id="btn-close-modal" class="modal-close-btn">&times;</button>
                </div>
                <form id="edit-game-form" class="todo-form">
                    <input type="hidden" id="edit-game-id">

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="edit-home-select" class="form-label">홈팀</label>
                            <select id="edit-home-select" class="select-control" required></select>
                        </div>
                        <div class="form-group half">
                            <label for="edit-away-select" class="form-label">원정팀</label>
                            <select id="edit-away-select" class="select-control" required></select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="edit-date-input" class="form-label">경기 날짜</label>
                            <input type="date" id="edit-date-input" class="input-control" required>
                        </div>
                        <div class="form-group half">
                            <label for="edit-time-input" class="form-label">경기 시간</label>
                            <input type="time" id="edit-time-input" class="input-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="edit-stadium-input" class="form-label">구장</label>
                        <input type="text" id="edit-stadium-input" class="input-control">
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="edit-status-select" class="form-label">경기 상태</label>
                            <select id="edit-status-select" class="select-control">
                                <option value="예정">🗓️ 예정</option>
                                <option value="진행중">🔴 진행중</option>
                                <option value="종료">🏁 종료</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label for="edit-broadcast-input" class="form-label">중계 채널</label>
                            <input type="text" id="edit-broadcast-input" class="input-control">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="edit-home-score-input" class="form-label">홈팀 스코어</label>
                            <input type="number" id="edit-home-score-input" class="input-control" min="0">
                        </div>
                        <div class="form-group half">
                            <label for="edit-away-score-input" class="form-label">원정팀 스코어</label>
                            <input type="number" id="edit-away-score-input" class="input-control" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="edit-memo-input" class="form-label">메모</label>
                        <textarea id="edit-memo-input" class="textarea-control" rows="2"></textarea>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="btn-cancel-edit" class="btn btn-secondary">취소</button>
                        <button type="submit" id="btn-save-edit" class="btn btn-primary">변경사항 저장</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 토스트 메시지 -->
        <div id="toast-container" class="toast-container" aria-live="polite"></div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
